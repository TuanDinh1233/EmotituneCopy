<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiTunes Playlist</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .nature-gif {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .playlist-container {
            padding: 20px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .playlist-item img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }
        .settings-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-button img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <img src="https://media.giphy.com/media/3o7TKO3AC42BMvPSJG/giphy.gif" alt="Nature Scene" class="nature-gif">
    
    <div class="playlist-container">
        <div class="playlist-item">
            <img src="album-placeholder.jpg" alt="Album Art">
            <div>
                <h3>Song Title</h3>
                <p>Artist Name</p>
            </div>
        </div>
        <div class="playlist-item">
            <img src="album-placeholder.jpg" alt="Album Art">
            <div>
                <h3>Song Title</h3>
                <p>Artist Name</p>
            </div>
        </div>
        <!-- Add more playlist items as needed -->
    </div>

    <button class="settings-button">
        <img src="gear-icon.png" alt="Settings">
    </button>
</body>
</html>
