<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Results — EmotiTunes</title>
    <style>
        :root{
            --bg:#0f1724;
            --card:#0b1220;
            --muted:#98a0b3;
            --accent:#1db954; /* Spotify green as accent; Apple will use custom */
            --glass: rgba(255,255,255,0.03);
            --radius:12px;
        }
        html,body{height:100%}
        body{
            margin:0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.00) 100%),
                var(--bg);
            color:#e6eef8;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            padding:32px;
            box-sizing:border-box;
        }

        .container{
            max-width:900px;
            margin:0 auto;
        }

        header{
            display:flex;
            align-items:center;
            gap:16px;
            margin-bottom:20px;
        }
        .brand {
            width:64px;
            height:64px;
            flex:0 0 64px;
            background:linear-gradient(135deg,#111827 0%, #0b1220 100%);
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow: 0 6px 18px rgba(2,6,23,0.6);
        }
        .brand h1{
            font-size:14px;
            margin:0;
            color:var(--muted);
        }
        header h2{
            margin:0;
            font-size:20px;
            font-weight:600;
            letter-spacing: -0.2px;
        }
        header p{margin:0;color:var(--muted);font-size:13px}

        .card{
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius:var(--radius);
            padding:18px;
            box-shadow: 0 8px 30px rgba(2,6,23,0.6);
            border:1px solid rgba(255,255,255,0.03);
        }

        .playlist{
            margin:0;
            padding:0;
            list-style:none;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .track{
            display:flex;
            gap:12px;
            align-items:center;
            padding:10px;
            border-radius:10px;
            transition:background .15s, transform .08s;
        }
        .track:hover{ background:var(--glass); transform:translateY(-2px); }

        .logo{
            width:56px;
            height:56px;
            border-radius:8px;
            flex:0 0 56px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border:1px solid rgba(255,255,255,0.03);
        }

        .meta{
            display:flex;
            flex-direction:column;
            gap:2px;
            min-width:0;
        }
        .title{
            font-size:15px;
            font-weight:600;
            color:#fff;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .artist{
            font-size:13px;
            color:var(--muted);
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .badge{
            margin-left:auto;
            font-size:12px;
            color:var(--muted);
            background:transparent;
            padding:6px 10px;
            border-radius:999px;
            border:1px solid rgba(255,255,255,0.03);
            display:inline-flex;
            align-items:center;
            gap:8px;
        }

        /* small screens */
        @media (max-width:520px){
            header{gap:12px}
            .brand{width:48px;height:48px}
            .logo{width:48px;height:48px}
            .title{font-size:14px}
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand" aria-hidden="true">
                <!-- simple emoticon logo -->
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="0" y="0" width="24" height="24" rx="5" fill="#0b1220"/>
                    <path d="M8 10c.667-1 3-1 4 0" stroke="#ffd166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="8.5" cy="8" r="1" fill="#ffd166"/>
                    <circle cx="15.5" cy="8" r="1" fill="#ffd166"/>
                </svg>
            </div>
            <div>
                <h2>Here are the results</h2>
                <p>Playlist generated from your query — tap a track to play (demo)</p>
            </div>
        </header>

        <main class="card" role="main">
            <!-- Playlist container -->
            <ul id="playlist" class="playlist" aria-live="polite">
                <!-- Items will be rendered here by JavaScript -->
            </ul>
        </main>
    </div>

    <script>
        /*
            Example: populate the playlist with JS models.
            Replace `songs` with your real data (e.g., server-rendered JSON or data injected
            by the calling page). Each item needs:
                - title: song title
                - artist: artist name
                - source: "spotify" or "apple" (other values will show a generic icon)
        */

        const songs = [
            { title: "Blinding Lights", artist: "The Weeknd", source: "spotify" },
            { title: "Levitating", artist: "Dua Lipa", source: "apple" },
            { title: "Save Your Tears", artist: "The Weeknd", source: "spotify" },
            { title: "Kiss Me More", artist: "Doja Cat feat. SZA", source: "apple" }
        ];

        const spotifySVG = `
            <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="5" fill="#1DB954"/>
                <g transform="translate(3.5 6.5)" fill="none" stroke="#071013" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9">
                    <path d="M0 1.5c5.5-3 11 0 15.5 3.3"/>
                    <path d="M0 4.8c4.2-2.2 8.6 0 12.2 2.5"/>
                    <path d="M0 8c3.1-1.6 6.8 0 9.4 1.6"/>
                </g>
            </svg>
        `;

        const appleSVG = `
            <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="5" fill="#111827"/>
                <path d="M15.5 7.1c-.9 1.1-1.9 1.6-3 1.6-.2-1.4.5-2.9 1.4-3.8.9-.9 2.3-1.5 3.5-1.1.2 1.6-.7 2.8-1.9 3.3zM12.5 10.7c-1.9 0-2.7 1-4.6 1-1.9 0-2.6-1-4.3-1.1 0 0 1.6 7 8.9 7 6.7 0 7.9-6.5 7.9-6.9-.1-.2-3.3.1-7.8-.0z" fill="#fff"/>
            </svg>
        `;

        function iconFor(source){
            if(!source) return appleSVG;
            source = source.toString().toLowerCase();
            if(source.includes('spotify')) return spotifySVG;
            if(source.includes('apple')) return appleSVG;
            // generic music note
            return `<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <rect width="24" height="24" rx="5" fill="#172033"/>
                <path d="M9 7v8.5A2.5 2.5 0 0 0 11.5 18H15V7h-6z" fill="#9fb0c8"/>
            </svg>`;
        }

        function renderPlaylist(list){
            const ul = document.getElementById('playlist');
            ul.innerHTML = '';
            list.forEach((s, idx) => {
                const li = document.createElement('li');
                li.className = 'track';
                li.tabIndex = 0;
                li.setAttribute('role', 'button');
                li.setAttribute('aria-label', `${s.title} by ${s.artist} — ${s.source || 'unknown'}`);
                li.innerHTML = `
                    <div class="logo" aria-hidden="true">${iconFor(s.source)}</div>
                    <div class="meta">
                        <div class="title">${escapeHtml(s.title)}</div>
                        <div class="artist">${escapeHtml(s.artist)}</div>
                    </div>
                    <div class="badge">${escapeHtml((s.source || 'unknown').toUpperCase())}</div>
                `;
                // demo click handler: replace with real play/navigation action
                li.addEventListener('click', () => {
                    alert("Play: " + s.title + " — " + s.artist);
                });
                li.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter' || e.key === ' ') li.click();
                });
                ul.appendChild(li);
            });
        }

        // simple escaping to avoid injecting HTML
        function escapeHtml(str){
            if(!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // initial render; in your app replace songs with server provided data
        renderPlaylist(songs);
    </script>
</body>
</html></ul></svg>
